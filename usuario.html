<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo"><a href="index.html"><img src="https://cdn.uc.assets.prezly.com/150844e9-af6b-47b3-a4f5-bbb950ff6521/-/crop/1081x1080/420,0/-/preview/" alt="logos"></a></div>
        <div class="search-bar"><input type="text" placeholder="Buscar en tus Pines..."></div>
        <div class="nav-actions">
            <a href="index.html" class="btn">Inicio</a>
        </div>
    </header>

    <section class="profile-header">
        <div class="profile-avatar">D</div>
        <h1 class="profile-name">Dario Cabezas</h1>
        <p class="profile-username">@dariocabezas</p>
        <div class="profile-stats">
            <span><strong>120</strong> Siguiendo</span> · <span><strong>345</strong> Seguidores</span>
        </div>
        <div class="profile-buttons">
            <button class="btn">Compartir</button>
            <button class="btn">Editar perfil</button>
        </div>
    </section>

    <div class="profile-tabs">
        <a href="#" class="tab active">Creados</a>
        <a href="#" class="tab">Guardados</a>
    </div>

    <main class="grid-container">
        <div class="pin-card">
            <img src="https://static.boredpanda.com/blog/wp-content/uploads/2023/02/images-with-no-context-63e65b8e165f3__700.jpg" alt="Mis Pines 1">
        </div>
        <div class="pin-card">
            <img src="https://wallpapers.com/images/hd/funny-random-pictures-625-x-1109-fzu47kvatitm0rci.jpg" alt="Mis Pines 2">
        </div>
    </main>

</body>
</html>
