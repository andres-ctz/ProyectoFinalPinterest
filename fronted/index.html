<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akemi PinSaved</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <a class="brand" href="index.html" aria-label="Ir al inicio">
            <img src="/imgs/Gemini_Generated_Image_wxx8n0wxx8n0wxx8.png" alt="Proyecto Pinterest">
        </a>

        <nav class="nav-links" aria-label="Navegacion principal">
            <a href="index.html" class="active">Inicio</a>
            <a href="#explorar">Explorar</a>
            <a href="crear-pin.html" data-user-link>Crear</a>
        </nav>

        <label class="search-bar">
            <span>Buscar</span>
            <input type="search" placeholder="Buscar ideas, estilos o inspiracion">
        </label>

        <div class="nav-actions">
            <a href="login.html" class="btn btn-ghost" data-auth-link>Entrar</a>
            <button class="btn btn-ghost" type="button" data-user-link data-logout>Salir</button>
            <a href="usuario.html" class="avatar-link" aria-label="Ver perfil" data-avatar>D</a>
        </div>
    </header>

    <section class="home-hero" id="explorar">
        <div>
            <p class="eyebrow">Akemi PinSaved - Explora y guarda ideas</p>
            <h1>Encuentra referencias visuales para tu proximo proyecto.</h1>
        </div>
        <a class="btn btn-primary" href="register.html" data-auth-link>Crear cuenta</a>
        <a class="btn btn-primary" href="crear-pin.html" data-user-link>Crear pin</a>
    </section>

    <main class="page-shell">
        <div class="section-heading">
            <h2>Inspiracion reciente</h2>

        </div>

        <section class="grid-container" id="pins-container" aria-live="polite">
            <p class="state-message">Cargando pines...</p>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
