<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Proyecto Pinterest</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
    <main class="auth-layout">
        <section class="auth-intro">
            <a class="brand auth-brand" href="index.html" aria-label="Ir al inicio">
                <img src="/imgs/Gemini_Generated_Image_wxx8n0wxx8n0wxx8.png" alt="Proyecto Pinterest">
            </a>
            <p class="eyebrow">Bienvenido de vuelta</p>
            <h1>Entra y continua guardando tus ideas favoritas.</h1>
        </section>

        <section class="auth-card">
            <h2>Iniciar sesion</h2>
            <p class="subtitle">Accede con tu correo y contrasena.</p>

            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" name="password" placeholder="Tu contrasena" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Iniciar sesion</button>
            </form>

            <p id="auth-message" class="form-message"></p>

            <p class="auth-footer">
                No tienes cuenta? <a href="register.html">Registrate</a>
            </p>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/auth.js?v=no-email-verify-1"></script>
</body>
</html>
