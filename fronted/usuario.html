<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <a class="brand" href="index.html" aria-label="Ir al inicio">
            <img src="/imgs/Gemini_Generated_Image_wxx8n0wxx8n0wxx8.png" alt="Proyecto Pinterest">
        </a>

        <label class="search-bar">
            <span>Buscar</span>
            <input type="search" placeholder="Buscar en tus pines">
        </label>

        <div class="nav-actions">
            <a href="index.html" class="btn btn-ghost">Inicio</a>
            <a href="crear-pin.html" class="btn btn-ghost" data-user-link>Crear</a>
            <a href="login.html" class="btn btn-ghost" data-auth-link>Entrar</a>
            <button class="btn btn-ghost" type="button" data-user-link data-logout>Salir</button>
        </div>
    </header>

    <main class="page-shell">
        <section class="profile-header">
            <div class="profile-avatar" id="profile-avatar">U</div>
            <p class="eyebrow">Perfil</p>
            <h1 class="profile-name" id="profile-name">Cargando usuario...</h1>
            <p class="profile-username" id="profile-username">@usuario</p>

            <div class="profile-stats" aria-label="Estadisticas del perfil">
                <span><strong id="created-count">0</strong> creados</span>
                <span><strong id="saved-count">0</strong> guardados</span>
            </div>

            <div class="profile-buttons">
                <a class="btn btn-primary" href="crear-pin.html" data-user-link>Crear pin</a>
                <button class="btn btn-ghost" type="button" id="edit-profile-btn" style="display: none;">Editar perfil</button>
            </div>
            <p id="profile-message" class="form-message"></p>
        </section>

        <nav class="profile-tabs" aria-label="Contenido del perfil">
            <button class="tab active" type="button" data-tab="created">Creados</button>
            <button class="tab" type="button" data-tab="saved">Guardados</button>
        </nav>

        <section class="grid-container profile-grid" id="profile-pins">
            <p class="state-message">Cargando pines...</p>
        </section>
    </main>

    <dialog class="modal" id="edit-profile-modal">
        <form class="modal-card" id="edit-profile-form">
            <div class="modal-header">
                <div>
                    <p class="eyebrow">Editar perfil</p>
                    <h2>Personaliza tu cuenta</h2>
                </div>
                <button class="modal-close" type="button" data-close-modal>&times;</button>
            </div>

            <div class="form-group">
                <label for="edit-profile-username">Nombre de usuario</label>
                <input type="text" id="edit-profile-username" required>
            </div>

            <div class="form-group">
                <label for="edit-profile-avatar">URL de avatar</label>
                <input type="url" id="edit-profile-avatar" placeholder="https://...">
            </div>

            <p class="form-message" id="edit-profile-message"></p>

            <div class="modal-actions">
                <button class="btn btn-ghost" type="button" data-close-modal>Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar perfil</button>
            </div>
        </form>
    </dialog>

    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
