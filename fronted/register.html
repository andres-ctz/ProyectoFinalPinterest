<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Proyecto Pinterest</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
    <main class="auth-layout">
        <section class="auth-intro">
            <a class="brand auth-brand" href="index.html" aria-label="Ir al inicio">
                <img src="/imgs/Gemini_Generated_Image_wxx8n0wxx8n0wxx8.png" alt="Proyecto Pinterest">
            </a>
            <p class="eyebrow">Crea tu espacio visual</p>
            <h1>Guarda referencias, descubre ideas y arma tableros a tu estilo.</h1>
        </section>

        <section class="auth-card">
            <h2>Crear cuenta</h2>
            <p class="subtitle">Completa tus datos para empezar.</p>

            <form class="auth-form" id="register-form">
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" placeholder="dariocabezas" required>
                </div>
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" name="password" placeholder="Crea una contrasena" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Continuar</button>
            </form>

            <p id="auth-message" class="form-message"></p>

            <p class="auth-footer">
                Ya tienes cuenta? <a href="login.html">Inicia sesion</a>
            </p>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/auth.js?v=no-email-verify-1"></script>
</body>
</html>
