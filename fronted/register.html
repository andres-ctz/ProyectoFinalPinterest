<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Pinterest Clone</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="logo">
            <img src="https://cdn.uc.assets.prezly.com/150844e9-af6b-47b3-a4f5-bbb950ff6521/-/crop/1081x1080/420,0/-/preview/" alt="logos">
        </div>
        <h2>Te damos la bienvenida a Pinterest</h2>
        <p class="subtitle">Suavicrepas</p>
        
        <form class="auth-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Introduce tu correo" required>
            </div>
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="Crea un nombre de usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Crea una contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Continuar</button>
        </form>

        <div class="auth-footer">
            ¿Ya eres miembro? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

</body>
</html>
