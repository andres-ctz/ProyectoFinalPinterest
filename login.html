<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Pinterest Clone</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="logo">
            <img src="https://cdn.uc.assets.prezly.com/150844e9-af6b-47b3-a4f5-bbb950ff6521/-/crop/1081x1080/420,0/-/preview/" alt="logos">
        </div>
        <h2>Iniciar sesión</h2>
        <p class="subtitle">HOLAAAAAA PERO CFM</p>
        <form class="auth-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Introduce tu correo" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Introduce tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
        </form>

        <div class="auth-footer">
            ¿No estás en Pinterest todavía? <a href="register.html">Regístrate</a>
        </div>
    </div>

</body>
</html>
